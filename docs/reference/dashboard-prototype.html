<!doctype html>
<!-- Throwaway LearnSync UI prototype. Compare layouts via ?role=admin|staff|student&variant=A|B|C&page=dashboard.
     Sample data only; access follows User-Acess Updated.docx and docs/REWRITE_USER_ACCESS.md. No API calls. Content drafts use browser-local sample storage. -->
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LearnSync · Page sketches</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #171717;
      --muted: #666;
      --line: #d5d5d5;
      --paper: #fff;
      --wash: #f7f7f7
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--wash);
      color: var(--ink);
      font: 14px/1.5 Arial, Helvetica, sans-serif
    }

    button,
    select {
      font: inherit;
      color: inherit
    }

    button {
      cursor: pointer;
      background: white;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 9px 14px
    }

    button:hover {
      background: #eee
    }

    button:focus-visible,
    select:focus-visible,
    a:focus-visible {
      outline: 2px solid black;
      outline-offset: 4px
    }

    button.active,
    .primary {
      background: var(--ink);
      color: white;
      border-color: var(--ink)
    }

    button.primary:hover {
      background: #333
    }

    h1,
    h2,
    h3,
    p {
      margin: 0
    }

    h1 {
      font-size: 30px;
      letter-spacing: -1px;
      line-height: 1.2
    }

    h2 {
      font-size: 17px;
      letter-spacing: -.3px
    }

    h3 {
      font-size: 16px
    }

    small,
    .muted {
      color: var(--muted)
    }

    small {
      font-size: 12px
    }

    label {
      display: flex;
      align-items: center;
      gap: 8px
    }

    select {
      background: white;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 7px
    }

    select:disabled {
      color: #777
    }

    a {
      color: inherit
    }

    .preview {
      border-bottom: 1px dashed #aaa;
      padding: 12px 25px;
      display: flex;
      align-items: center;
      gap: 22px;
      flex-wrap: wrap;
      background: #fff
    }

    .preview strong {
      font-size: 12px;
      letter-spacing: 1.3px
    }

    .role-tabs {
      display: flex;
      gap: 5px
    }

    .role-tabs button {
      padding: 6px 15px;
      font-size: 12px
    }

    .preview .state {
      margin-left: auto;
      font-size: 11px;
      color: #666
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 19px;
      font-weight: bold;
      letter-spacing: -.6px
    }

    .mark {
      height: 28px;
      width: 28px;
      background: #171717;
      color: white;
      display: grid;
      place-items: center;
      border-radius: 5px;
      font-size: 16px
    }

    .header {
      height: 76px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      border-bottom: 1px solid var(--line)
    }

    .identity {
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: right
    }

    .avatar {
      width: 35px;
      height: 35px;
      border: 1px solid #999;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 12px
    }

    .header-meta {
      font-size: 12px;
      color: #666;
      border-left: 1px solid var(--line);
      padding-left: 20px;
      margin-left: 20px;
      font-weight: normal;
      letter-spacing: 0
    }

    .shell {
      display: grid;
      grid-template-columns: 205px minmax(0, 1fr);
      min-height: calc(100vh - 136px)
    }

    .sidebar {
      border-right: 1px solid var(--line);
      background: white;
      padding: 26px 18px;
      display: flex;
      flex-direction: column;
      gap: 7px
    }

    .nav-label {
      font-size: 10px;
      letter-spacing: 1.7px;
      color: #777;
      padding: 0 12px;
      margin: 10px 0
    }

    .sidebar button {
      text-align: left;
      border-color: transparent;
      font-size: 13px;
      display: flex;
      gap: 11px;
      align-items: center
    }

    .sidebar button.active {
      background: #eee;
      color: black;
      border-color: #ddd;
      font-weight: bold
    }

    .nav-icon {
      font-size: 15px;
      width: 16px;
      text-align: center
    }

    .sidebar .aside-note {
      margin-top: auto;
      border-top: 1px solid var(--line);
      padding: 18px 12px 0;
      font-size: 11px;
      color: #777
    }

    .content {
      max-width: 1280px;
      width: 100%;
      margin: auto;
      padding: 32px 36px 110px;
      align-self: start
    }

    .page-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 27px
    }

    .eyebrow {
      font-size: 10px;
      letter-spacing: 1.8px;
      color: #666;
      margin-bottom: 7px;
      text-transform: uppercase
    }

    .intro {
      margin-top: 8px;
      color: #666;
      font-size: 13px
    }

    .date {
      font-size: 12px;
      border: 1px dashed #aaa;
      padding: 7px 12px;
      border-radius: 4px;
      white-space: nowrap
    }

    .dashboard {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 22px
    }

    .main-stack,
    .side-stack {
      display: flex;
      flex-direction: column;
      gap: 22px
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
      padding: 21px
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 17px
    }

    .text-button {
      border: 0;
      background: none;
      padding: 2px;
      font-size: 12px;
      text-decoration: underline;
      text-underline-offset: 3px;
      border-radius: 0
    }

    .badge {
      border: 1px solid #aaa;
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 10px;
      white-space: nowrap
    }

    .hero {
      border-color: #444;
      background: #fff;
      padding: 26px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      min-height: 155px
    }

    .hero h2 {
      font-size: 23px;
      line-height: 1.25;
      max-width: 470px;
      margin: 8px 0
    }

    .hero p {
      max-width: 460px;
      font-size: 12px;
      color: #666
    }

    .hero .primary {
      margin-top: 16px
    }

    .hero-art {
      width: 95px;
      height: 95px;
      flex-shrink: 0;
      border: 1px dashed #aaa;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font: 40px Georgia, serif
    }

    .hero-art span {
      transform: rotate(-12deg)
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff
    }

    .metric {
      padding: 18px 20px;
      border-right: 1px solid var(--line)
    }

    .metric:last-child {
      border: 0
    }

    .metric b {
      font-size: 26px;
      font-weight: normal;
      display: block
    }

    .metric small {
      font-size: 11px
    }

    .row {
      display: flex;
      gap: 13px;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid #e4e4e4
    }

    .row:last-child {
      border-bottom: 0;
      padding-bottom: 0
    }

    .row:first-child {
      padding-top: 0
    }

    .row .body {
      flex: 1;
      min-width: 0
    }

    .row strong {
      display: block;
      font-size: 13px;
      font-weight: 600
    }

    .row small {
      display: block;
      margin-top: 4px;
      font-size: 11px
    }

    .box-icon {
      width: 32px;
      height: 32px;
      border: 1px solid #aaa;
      border-radius: 5px;
      display: grid;
      place-items: center;
      font-size: 13px;
      flex-shrink: 0
    }

    .row button {
      padding: 6px 11px;
      font-size: 11px
    }

    .courses {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px
    }

    .course {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 17px
    }

    .course-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 10px;
      margin-bottom: 19px;
      color: #666
    }

    .course h3 {
      font-size: 15px;
      margin-bottom: 4px
    }

    .course p {
      font-size: 11px;
      color: #666
    }

    .course .course-bottom {
      border-top: 1px dashed #ccc;
      margin-top: 17px;
      padding-top: 12px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      font-size: 11px
    }

    .progress {
      height: 5px;
      background: #e6e6e6;
      margin: 12px 0 7px;
      border-radius: 2px;
      overflow: hidden
    }

    .progress span {
      display: block;
      height: 100%;
      background: #555
    }

    .mini-title {
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 13px;
      color: #666
    }

    .note {
      border-left: 2px solid #555;
      padding-left: 12px;
      margin-bottom: 17px
    }

    .note:last-child {
      margin-bottom: 0
    }

    .note strong {
      font-size: 12px
    }

    .note p {
      font-size: 11px;
      color: #666;
      margin-top: 5px
    }

    .management {
      border-style: dashed
    }

    .management button {
      display: block;
      width: 100%;
      text-align: left;
      margin-top: 8px;
      font-size: 12px
    }

    .management>p {
      font-size: 11px;
      color: #666;
      margin-bottom: 14px
    }

    .table-wrap {
      overflow: auto
    }

    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 12px
    }

    th {
      text-align: left;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #777;
      font-weight: normal;
      border-bottom: 1px solid #aaa;
      padding: 0 10px 10px 0
    }

    td {
      border-bottom: 1px solid #e4e4e4;
      padding: 14px 10px 14px 0
    }

    tbody tr:last-child td {
      border: 0
    }

    td small {
      display: block;
      font-size: 10px
    }

    td .text-button {
      font-size: 11px
    }

    .avatar-sm {
      width: 28px;
      height: 28px;
      display: inline-grid;
      place-items: center;
      border: 1px solid #aaa;
      border-radius: 50%;
      margin-right: 10px;
      font-size: 10px
    }

    .person {
      display: flex;
      align-items: center;
      white-space: nowrap
    }

    .checks {
      list-style: none;
      margin: 0;
      padding: 0
    }

    .checks li {
      border-bottom: 1px solid #ddd;
      padding: 12px 0;
      font-size: 12px
    }

    .checks li:last-child {
      border: 0;
      padding-bottom: 0
    }

    .checks li:before {
      content: '□';
      margin-right: 9px
    }

    .switcher {
      position: fixed;
      bottom: 19px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 10;
      background: #171717;
      color: white;
      border: 1px solid #444;
      border-radius: 50px;
      padding: 7px 10px;
      box-shadow: 0 3px 15px #0002;
      font-size: 12px;
      white-space: nowrap
    }

    .switcher button {
      border: 1px solid #666;
      border-radius: 50%;
      background: transparent;
      color: white;
      width: 31px;
      height: 31px;
      padding: 0
    }

    .switcher button:hover {
      background: #444
    }

    .switcher span {
      min-width: 180px;
      text-align: center
    }

    .switcher small {
      color: #bbb;
      font-size: 10px
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 80px;
      transform: translateX(-50%);
      max-width: 90vw;
      background: white;
      color: black;
      border: 1px solid black;
      border-radius: 5px;
      padding: 12px 20px;
      box-shadow: 0 3px 12px #0002;
      font-size: 12px;
      z-index: 20
    }

    .toast:empty {
      display: none
    }

    /* B puts subjects / users first, with horizontal navigation and a full-width overview. */
    body[data-variant=B] .shell {
      display: block
    }

    body[data-variant=B] .sidebar {
      padding: 12px 30px;
      flex-direction: row;
      border-right: 0;
      border-bottom: 1px solid var(--line);
      gap: 8px
    }

    body[data-variant=B] .nav-label,
    body[data-variant=B] .aside-note {
      display: none
    }

    body[data-variant=B] .content {
      max-width: 1390px
    }

    body[data-variant=B] .dashboard {
      grid-template-columns: minmax(0, 1fr) 310px
    }

    body[data-variant=B] .hero {
      order: 2;
      min-height: 0
    }

    body[data-variant=B] .metrics {
      order: 0
    }

    body[data-variant=B] .subject-panel {
      order: 1
    }

    body[data-variant=B] .task-panel {
      order: 3
    }

    body[data-variant=B] .courses {
      grid-template-columns: repeat(3, minmax(0, 1fr))
    }

    /* C replaces the card overview with an agenda and compact subject rows. */
    body[data-variant=C] .shell {
      grid-template-columns: 160px minmax(0, 1fr)
    }

    body[data-variant=C] .dashboard {
      grid-template-columns: minmax(0, 1fr) 265px
    }

    body[data-variant=C] .task-panel {
      order: 0;
      border: 0;
      border-radius: 0;
      padding: 0;
      background: transparent
    }

    body[data-variant=C] .hero {
      order: 1;
      border: 0;
      border-radius: 0;
      border-top: 1px solid #999;
      border-bottom: 1px solid #999;
      background: transparent;
      padding: 22px 0;
      min-height: 0
    }

    body[data-variant=C] .hero-art {
      display: none
    }

    body[data-variant=C] .metrics {
      order: 3;
      background: transparent;
      border: 0
    }

    body[data-variant=C] .subject-panel {
      order: 2;
      border: 0;
      background: transparent;
      padding: 5px 0
    }

    body[data-variant=C] .courses {
      display: block
    }

    body[data-variant=C] .course {
      display: grid;
      grid-template-columns: 95px 1fr 200px;
      align-items: center;
      border: 0;
      border-bottom: 1px solid #ccc;
      border-radius: 0;
      padding: 15px 0;
      gap: 18px
    }

    body[data-variant=C] .course-top {
      margin: 0;
      display: block
    }

    body[data-variant=C] .course-top .badge {
      display: none
    }

    body[data-variant=C] .course-bottom {
      margin: 0;
      padding: 0;
      border: 0
    }

    body[data-variant=C] .course-progress {
      display: none
    }

    body[data-variant=C] .task-panel .row {
      padding: 18px 0
    }

    body[data-variant=C] .task-panel .box-icon {
      border: 0;
      border-radius: 0;
      border-left: 2px solid #333;
      font: 16px Georgia, serif;
      height: 40px
    }

    @media(min-width:1450px) {
      .content {
        padding-top: 42px
      }

      .panel {
        padding: 25px
      }

      .hero {
        padding: 30px
      }
    }

    @media(max-width:1080px) {
      .content {
        padding: 25px 24px 110px
      }

      .dashboard,
      body[data-variant=B] .dashboard,
      body[data-variant=C] .dashboard {
        grid-template-columns: minmax(0, 1fr) 245px
      }

      .shell {
        grid-template-columns: 170px minmax(0, 1fr)
      }

      .hero-art {
        display: none
      }

      body[data-variant=B] .courses {
        grid-template-columns: repeat(2, minmax(0, 1fr))
      }

      body[data-variant=C] .course {
        grid-template-columns: 70px 1fr
      }

      .course-bottom {
        grid-column: auto
      }

      body[data-variant=C] .course-bottom {
        grid-column: 2
      }

      .preview .state {
        display: none
      }

      .header-meta {
        display: none
      }
    }

    @media(max-width:760px) {
      .preview {
        padding: 12px 16px;
        gap: 12px
      }

      .preview strong {
        width: 100%
      }

      .preview label {
        font-size: 11px
      }

      .header {
        padding: 0 16px;
        height: 64px
      }

      .identity small {
        display: none
      }

      .identity {
        font-size: 12px
      }

      .shell,
      body[data-variant=C] .shell {
        display: block
      }

      .sidebar,
      body[data-variant=B] .sidebar {
        flex-direction: row;
        overflow: auto;
        padding: 10px 12px;
        border-right: 0;
        border-bottom: 1px solid var(--line)
      }

      .sidebar button {
        white-space: nowrap;
        padding: 8px 10px;
        font-size: 11px
      }

      .nav-label,
      .aside-note {
        display: none
      }

      .content {
        padding: 24px 16px 105px
      }

      .page-heading {
        align-items: start
      }

      h1 {
        font-size: 25px
      }

      .date {
        display: none
      }

      .dashboard,
      body[data-variant=B] .dashboard,
      body[data-variant=C] .dashboard {
        display: block
      }

      .main-stack,
      .side-stack {
        gap: 17px
      }

      .side-stack {
        margin-top: 17px
      }

      .panel {
        padding: 18px
      }

      .hero h2 {
        font-size: 21px
      }

      .courses,
      body[data-variant=B] .courses {
        grid-template-columns: 1fr
      }

      .metric {
        padding: 14px 12px
      }

      .metric b {
        font-size: 22px
      }

      .switcher {
        gap: 8px;
        bottom: 12px
      }

      .switcher small {
        display: none
      }

      .switcher span {
        min-width: 165px
      }

      body[data-variant=C] .course {
        grid-template-columns: 65px 1fr
      }

      .row button {
        flex-shrink: 0
      }
    }

    @media print {

      .preview,
      .switcher,
      .toast {
        display: none
      }

      .content {
        padding-bottom: 20px
      }

      body {
        background: white
      }

      .shell {
        min-height: 0
      }

      .panel,
      .course {
        break-inside: avoid
      }
    }
  </style>
  <style>
    :root {
      --ink: #193447;
      --muted: #5d7180;
      --line: #d8e2e8;
      --wash: #f4f7f9;
      --blue: #186891;
      --navy: #12354b
    }

    body {
      font-family: Inter, Arial, sans-serif
    }

    button,
    select,
    input,
    textarea {
      border-radius: 9px
    }

    button:hover {
      background: #e7f2f7
    }

    button.primary,
    button.active,
    .primary {
      background: var(--blue);
      border-color: var(--blue);
      color: white
    }

    button.primary:hover {
      background: #115477
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible {
      outline: 3px solid #8ed6e8;
      outline-offset: 2px
    }

    .mark {
      background: var(--blue)
    }

    .sidebar {
      background: var(--navy);
      border-color: var(--navy)
    }

    .sidebar button {
      background: transparent;
      color: #e5f0f5
    }

    .sidebar button:hover,
    .sidebar button.active {
      background: #28627c;
      color: white;
      border-color: transparent
    }

    .sidebar button.active {
      box-shadow: inset 3px 0 #8ed6e8
    }

    .sidebar .nav-label,
    .sidebar .aside-note {
      color: #95bdcf
    }

    .sidebar .aside-note {
      border-color: #31576b
    }

    .panel,
    .metrics {
      border-radius: 14px;
      box-shadow: 0 5px 20px #12354b06
    }

    .hero {
      background: #e7f2f7;
      border-color: #c7e2ee
    }

    .hero-art {
      color: var(--blue);
      border-color: #8ebed3;
      background: #ffffff80
    }

    .badge,
    .box-icon,
    .avatar-sm {
      background: #e7f2f7;
      border-color: #c7e2ee;
      color: #115477
    }

    .badge {
      border-radius: 30px
    }

    .progress {
      background: #e1edf2
    }

    .progress span {
      background: #167457
    }

    .course {
      border-radius: 12px
    }

    .course-top,
    .hero p,
    .intro,
    .eyebrow,
    .note p,
    .management>p,
    .preview .state,
    .header-meta {
      color: var(--muted)
    }

    .note {
      border-color: var(--blue)
    }

    .notice-line {
      background: #e7f2f7;
      border-color: #c7e2ee;
      color: var(--ink)
    }

    .switcher {
      background: var(--navy);
      border-color: #31576b
    }

    .toast {
      border-color: var(--line);
      color: var(--ink)
    }

    .chat-message {

    <p style="margin:14px 0">Your draft is saved on this browser. Review the questions, answer keys, sources, audience,
      and attempt policy before publishing.</p>

  </dialog>
  <div class="switcher" aria-label="Layout comparison"><button id="previous"
      aria-label="Previous layout">←</button><span id="variant-label"></span><button id="next"
      aria-label="Next layout">→</button><small>← → compare layouts</small></div>
  <script>
    const params = new URLSearchParams(location.search);
    let role = ['admin', 'staff', 'student'].includes(params.get('role')) ? params.get('role') : 'student';
    let variant = ['A', 'B', 'C'].includes(params.get('variant')) ? params.get('variant') : 'A';
    let access = params.get('access') === 'extended' ? 'extended' : 'teaching';
    let page = params.get('page') || 'dashboard';
    const variants = ['A', 'B', 'C'], names = { A: 'Focus first', B: 'Overview first', C: 'Daily agenda' };
    const subjects = [
      { code: 'ENT 101', name: 'Entrepreneurial Mindset', teacher: 'Prof. Reyes', lesson: 'Recognizing opportunities', progress: 60, sections: 'BS ENT 2A · 2B', students: 62 },
      { code: 'ENT 102', name: 'Business Planning', teacher: 'Prof. Cruz', lesson: 'Understanding your customer', progress: 35, sections: 'BS ENT 2A', students: 31 },
      { code: 'ENT 103', name: 'Financial Management', teacher: 'Prof. Santos', lesson: 'Cash flow basics', progress: 45, sections: 'BS ENT 2B', students: 31 }
    ];
    const button = (label, primary = false) => `<button data-preview="${label}" class="${primary ? 'primary' : ''}">${label}</button>`;
    const textButton = label => `<button class="text-button" data-preview="${label}">${label}</button>`;
    const panel = (title, content, action = '', extra = '') => `<section class="panel ${extra}"><div class="panel-head"><h2>${title}</h2>${action ? textButton(action) : ''}</div>${content}</section>`;
    const metric = (value, label) => `<div class="metric"><b>${value}</b><small>${label}</small></div>`;
    const row = (icon, title, detail, action) => `<div class="row"><span class="box-icon" aria-hidden="true">${icon}</span><div class="body"><strong>${title}</strong><small>${detail}</small></div>${button(action)}</div>`;
    function course(s) {
      return `<article class="course"><div class="course-top"><span>${s.code}</span><span class="badge">${role === 'student' ? 'Enrolled' : 'Assigned'}</span></div><div><h3>${s.name}</h3><p>${role === 'student' ? s.teacher + ' · BS ENT 2A' : s.sections + ' · ' + s.students + ' students'}</p></div>${role === 'student' ? `<div class="course-progress"><div class="progress" role="progressbar" aria-label="${s.name}: lessons completed" aria-valuenow="${s.progress}" aria-valuemin="0" aria-valuemax="100"><span style="width:${s.progress}%"></span></div><small>${s.progress}% of published lessons completed</small></div>` : ''}<div class="course-bottom"><span>${role === 'student' ? 'Continue learning' : 'Content · Assessments · Grades'}</span>${textButton(role === 'student' ? 'Open subject' : 'Teach →')}</div></article>`;
    }
    function hero(kicker, title, detail, action, art) { return `<section class="panel hero"><div><div class="eyebrow">${kicker}</div><h2>${title}</h2><p>${detail}</p>${button(action, true)}</div><div class="hero-art" aria-hidden="true"><span>${art}</span></div></section>`; }
    function management() { return false ? panel('Academic management', `<p>Your additional faculty permissions</p>${button('Manage subjects')}${button('Manage classes')}${button('Assign subjects')}`, '', 'management') : ''; }
    function render() {
      document.body.dataset.variant = variant;
      document.querySelectorAll('[data-role]').forEach(b => { b.classList.toggle('active', b.dataset.role === role); b.setAttribute('aria-pressed', b.dataset.role === role); });
      document.getElementById('access').value = access; document.getElementById('access').disabled = role !== 'staff';
      document.getElementById('state').textContent = `${role.toUpperCase()} · Layout ${variant}${role === 'staff' ? ' · ' + (access === 'extended' ? 'Teaching + management' : 'Teaching only') : ''}`;
      document.getElementById('variant-label').textContent = `${variant} / ${names[variant]}`;
      const identity = { admin: ['Alex Mendoza', 'Administrator', 'AM'], staff: ['Prof. Maria Reyes', 'Teaching faculty', 'MR'], student: ['Jamie Santos', 'Student · BS ENT 2A', 'JS'] }[role];
      document.getElementById('identity').innerHTML = `<div>${identity[0]}<br><small>${identity[1]}</small></div><span class="avatar">${identity[2]}</span>`;
      const nav = { admin: [['⌂', 'Dashboard'], ['♧', 'Users']], staff: [['⌂', 'Dashboard'], ['▤', 'My subjects'], ['✓', 'Grading'], ['≡', 'Syllabus']], student: [['⌂', 'Dashboard'], ['▤', 'My subjects'], ['□', 'To-do'], ['✓', 'My grades'], ['◇', 'Study assistant']] }[role];
      document.getElementById('nav').innerHTML = `<div class="nav-label">YOUR WORKSPACE</div>${nav.map(([icon, title], i) => `<button ${i ? 'data-preview="' + title + '"' : 'class="active" aria-current="page"'}><span class="nav-icon" aria-hidden="true">${icon}</span>${title}</button>`).join('')}<div class="aside-note">${role === 'admin' ? 'User accounts & access' : role === 'staff' ? 'Your assigned teaching subjects' : 'A little progress, every day'}<br><br>AY 2026–2027<br>First semester</div>`;
      let title, intro, main, side;
      if (role === 'admin') {
        title = 'Your academic workspace.'; intro = 'Manage academic setup, enrollment, teacher assignments, and accounts.';
        main = hero('Needs your attention', '3 accounts need activation', 'Review the new user accounts before granting access.', 'Review accounts', '♧') +
          `<section class="metrics" aria-label="User summary">${metric('248', 'Students')}${metric('18', 'Faculty')}${metric('3', 'Inactive accounts')}</section>` +
          panel('Recent users', `<div class="table-wrap"><table><thead><tr><th>Name</th><th>Role</th><th>Status</th><th>Action</th></tr></thead><tbody>${[['JS', 'Jamie Santos', 'Student', 'Active'], ['MR', 'Maria Reyes', 'Faculty', 'Active'], ['AD', 'Andre Dela Cruz', 'Student', 'Inactive'], ['EC', 'Elena Cruz', 'Faculty', 'Inactive']].map(([initial, name, type, status]) => `<tr><td><span class="person"><span class="avatar-sm">${initial}</span>${name}</span></td><td>${type}</td><td><span class="badge">${status}</span></td><td>${textButton('Manage')}</td></tr>`).join('')}</tbody></table></div>`, 'View all users', 'subject-panel') +
          panel('Account tasks', row('01', 'Activate new accounts', '3 users · Awaiting access', 'Review') + row('02', 'Check faculty permissions', 'Elena Cruz · Teaching access requested', 'Review'), '', 'task-panel');
        side = panel('User actions', `<p class="muted" style="font-size:12px;margin-bottom:16px">Add a person or update their account access.</p>${button('+ Add user', true)}<div class="row"><div class="body"><strong>Find an existing user</strong><small>Search by name or school email</small></div>${textButton('Find user')}</div>`) +
          panel('Recent account activity', `<div class="note"><strong>Maria Reyes activated</strong><p>Faculty account · Today, 9:10 AM</p></div><div class="note"><strong>Jamie Santos added</strong><p>Student account · Yesterday</p></div><div class="note"><strong>Faculty permissions updated</strong><p>Maria Reyes · Yesterday</p></div>`);
      } else if (role === 'staff') {
        title = 'Good morning, Prof. Reyes.'; intro = 'Your subjects, teaching tasks, and grading at a glance.';
        main = hero('Your next teaching task', '12 submissions are ready to grade', 'Opportunity journal · Entrepreneurial Mindset · BS ENT 2A', 'Review submissions', '✓') +
          `<section class="metrics" aria-label="Teaching summary">${metric('3', 'Assigned subjects')}${metric('62', 'Distinct students')}${metric('12', 'To grade')}</section>` +
          panel('My subjects', `<div class="courses">${subjects.slice(0, variant === 'B' ? 3 : 2).map(course).join('')}</div>`, 'View all 3', 'subject-panel') +
          panel('Teaching checklist', row('01', 'Continue your lesson draft', 'Saved automatically · Not published', 'Prepare content') + row('02', 'Record today’s attendance', 'Entrepreneurial Mindset · BS ENT 2A', 'Attendance') + row('03', 'Review midterm grades', 'Financial Management · Not yet published', 'Review grades'), '', 'task-panel');
        side = panel('Upcoming deadlines', `<div class="note"><strong>Today · 11:59 PM</strong><p>Opportunity journal closes<br>Entrepreneurial Mindset</p></div><div class="note"><strong>Monday · 10:00 AM</strong><p>Business model quiz<br>Business Planning</p></div>`) +
          management() + panel('Prepare for your class', `<p class="muted" style="font-size:12px;margin-bottom:15px">Create learning content or an assessment within one of your subjects.</p>${button('Choose a subject')}`);
      } else {
        title = 'Let’s keep learning, Jamie.'; intro = 'One clear next step, with everything else close by.';
        main = hero('Pick up where you left off', 'Recognizing opportunities', 'Entrepreneurial Mindset · Chapter 2, Lesson 3', 'Continue lesson', '▤') +
          `<section class="metrics" aria-label="Learning summary">${metric('6', 'Enrolled subjects')}${metric('2', 'Tasks due soon')}${metric('1', 'New grade published')}</section>` +
          panel('My subjects', `<div class="courses">${subjects.slice(0, variant === 'B' ? 3 : 2).map(course).join('')}</div>`, 'View all 6', 'subject-panel') +
          panel('Coming up', row('01', 'Opportunity journal', 'Entrepreneurial Mindset · Due today, 11:59 PM', 'View activity') + row('02', 'Business model quiz', 'Business Planning · Due Monday, 10:00 AM', 'View quiz'), 'View to-do', 'task-panel');
        side = panel('Course updates', `<div class="note"><strong>Midterm grade published</strong><p>Financial Management · Prof. Santos</p>${textButton('View grade')}</div><div class="note"><strong>New learning material</strong><p>Business Planning · Customer interviews</p>${textButton('View material')}</div>`) +
          panel('Need a little help?', `<div class="eyebrow">Study assistant</div><p class="muted" style="font-size:12px;margin-bottom:16px">Ask a question about your learning materials.</p>${button('Ask study assistant')}`) +
          panel('Your next milestone', `<p style="font-size:12px">Finish Chapter 2</p><p class="muted" style="font-size:11px;margin-top:6px">Entrepreneurial Mindset · 2 lessons left</p><div class="progress" role="progressbar" aria-label="Chapter 2 lessons completed" aria-valuenow="3" aria-valuemin="0" aria-valuemax="5"><span style="width:60%"></span></div><small>3 of 5 published lessons completed</small>`);
      }
      document.getElementById('dashboard').innerHTML = `<div class="page-heading"><div><div class="eyebrow">${role === 'admin' ? 'Admin' : role === 'staff' ? 'Staff' : 'Student'} dashboard</div><h1>${title}</h1><p class="intro">${intro}</p></div><span class="date">Saturday, 03 October</span></div><div class="dashboard"><div class="main-stack">${main}</div><aside class="side-stack" aria-label="Updates and shortcuts">${side}</aside></div>`;
    }
    function update() { const url = new URL(location.href); url.searchParams.set('role', role); url.searchParams.set('variant', variant); url.searchParams.set('access', access); url.searchParams.set('page', page); history.replaceState(history.state, '', url); document.getElementById('notice').textContent = ''; render(); }
    function cycle(direction) { variant = variants[(variants.indexOf(variant) + direction + 3) % 3]; update(); }
    document.querySelectorAll('[data-role]').forEach(b => b.addEventListener('click', () => { role = b.dataset.role; page = 'dashboard'; update(); }));
    document.getElementById('access').addEventListener('change', e => { access = e.target.value; update(); });
    document.getElementById('previous').addEventListener('click', () => cycle(-1)); document.getElementById('next').addEventListener('click', () => cycle(1));
    document.addEventListener('keydown', e => { if (e.target.closest('input,textarea,select,[contenteditable],button')) return; if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); cycle(e.key === 'ArrowLeft' ? -1 : 1); } });
    let noticeTimer;
    document.addEventListener('click', e => { const b = e.target.closest('[data-preview]'); if (!b) return; const target = window.prototypeDestination?.(b.dataset.preview); if (target) { window.openPrototypePage(target); return; } document.getElementById('notice').textContent = `${b.dataset.preview} — sketch only. This action is a placeholder.`; clearTimeout(noticeTimer); noticeTimer = setTimeout(() => document.getElementById('notice').textContent = '', 4000); });
    render();
  </script>
